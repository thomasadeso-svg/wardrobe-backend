# Test-only CI. Never deploys, does not access secrets or live APIs.
name: Styligma v9 full backend integration (isolated)
on:
  push:
    branches:
      - 'test/serverless-v9-integrated-20261105'
permissions:
  contents: read
concurrency:
  group: styligma-v9-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANTHROPIC_API_KEY: ""
      REMOVE_BG_API_KEY: ""
      STYLIGMA_DURABLE_JOBS_ENABLED: "0"
      RAILWAY_PROJECT_ID: ""
      RAILWAY_ENVIRONMENT_ID: ""
      PYTHONDONTWRITEBYTECODE: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install production-declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # FastAPI 0.104.1 / Starlette 0.27 TestClient needs httpx<0.28.
          # This is a CI compatibility pin, NOT a production dependency change.
          python -m pip install httpx==0.27.2
      - name: Test original backend and opt-in v9 integration together
        run: python -W ignore::DeprecationWarning -m unittest discover -v
