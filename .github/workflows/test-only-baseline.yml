# Test-only branch; no deploy, no secrets, no paid AI requests.
name: Styligma backend baseline (isolated)
on:
  push:
    branches:
      - 'test/cost-safety-baseline-nov2026'
permissions:
  contents: read
concurrency:
  group: styligma-test-baseline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANTHROPIC_API_KEY: ""
      REMOVE_BG_API_KEY: ""
      PYTHONDONTWRITEBYTECODE: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install declared backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run original baseline tests (without external API keys)
        run: python -W ignore::DeprecationWarning -m unittest discover -v
